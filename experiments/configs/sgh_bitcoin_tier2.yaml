series_id: bitcoin
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 1000
  step: 30
  embargo: 0
costs_bps: [10, 20]
models:
  - lstm
  - tft
  - svm
  - hellformer
lstm:
  window_grid: [30, 60, 90]
  hidden_grid: [16, 32, 64]
  lr_grid: [0.0005, 0.001, 0.002]
  max_epochs: 40
  patience: 8
  layers: 1
tft:
  window: 63
  hidden: 32
  nhead: 2
  dropout: 0.1
  lr: 0.001
  max_epochs: 45
  patience: 8
svm:
  c_grid: [0.1, 1.0, 10.0, 100.0]
  epsilon: 0.01
hellformer:
  window_grid: [30, 60, 90]
  d_model: 32
  nhead: 2
  num_layers: 1
  dropout: 0.1
  kernel_sizes: [3, 7, 15]
  lr: 0.001
  max_epochs: 45
  patience: 8
