series_id: bitcoin
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 1000
  step: 30
  embargo: 0
costs_bps: [10, 20]
models:
  - xgboost
# pierwszy przebieg CPU: pojedyncza konfiguracja (jak w results/baselines.json);
# pelna siatka 3x3 kosztuje >2 min/fold x 160 foldów x 3 horyzonty -> zadanie GPU (sgh-4)
xgboost:
  n_estimators: 400
  max_depth_grid: [4]
  learning_rate_grid: [0.05]
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
