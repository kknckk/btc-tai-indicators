series_id: bitcoin
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 1000
  step: 30
  embargo: 0
costs_bps: [10, 20]
models:
  - bilstm
  - xgboost
bilstm:
  window_grid: [30, 60, 90]
  hidden_grid: [16, 32, 64]
  lr_grid: [0.0005, 0.001, 0.002]
  max_epochs: 40
  patience: 8
  layers: 1
xgboost:
  n_estimators: 400
  max_depth_grid: [3, 4, 6]
  learning_rate_grid: [0.03, 0.05, 0.1]
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
