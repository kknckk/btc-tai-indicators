series_id: bitcoin
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 1000
  step: 30
  embargo: 0
costs_bps: [10, 20]
models:
  - bilstm
# GPU (L4): pojedyncza konfiguracja przeskanowana wstepnie; pelna siatka 3x3x3
# x ~480 foldow przekracza budzet czasu nawet na GPU — zanotowane jako ograniczenie
bilstm:
  window_grid: [60]
  hidden_grid: [32]
  lr_grid: [0.001]
  max_epochs: 40
  patience: 8
  layers: 1
