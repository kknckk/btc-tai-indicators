series_id: oil
target_kind: log_return
results_stem: sgh_oil_tier1_ret
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 504
  step: 21
  embargo: 0
costs_bps: [10, 20]
models:
  - lstm_svr
  - xgboost
  - garch_midas
lstm_svr:
  window_grid: [21, 42, 63]
  hidden_grid: [16, 32]
  lr_grid: [0.0005, 0.001]
  max_epochs: 40
  patience: 8
  layers: 1
  svr_c_grid: [0.1, 1.0, 10.0]
  svr_gamma_grid: [scale, auto]
xgboost:
  n_estimators: 200
  max_depth_grid: [3, 4, 6]
  learning_rate_grid: [0.03, 0.05, 0.1]
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 20
garch_midas:
  k_grid: [3, 4, 6]
  theta1_grid: [1.0, 2.0]
  theta2_grid: [5.0, 10.0]
  mean_lags_grid: [0, 1]
  dist_grid: [normal, t]
  rv_window: 22
