series_id: gold
target_kind: log_return
results_stem: sgh_gold_tier2_ret
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 504
  step: 21
  embargo: 0
costs_bps: [10, 20]
models:
  - timegpt
  - var_lstm
  - tvp_var
timegpt:
  min_hist: 80
  ets_trend_grid: [add, mul, null]
  ets_seasonal_grid: [null]
  prefer_nixtla: true
var_lstm:
  ridge_alpha: 1.0
  min_hist: 60
  p_grid: [1, 2, 3, 4]
  lstm:
    window_grid: [21, 42]
    hidden_grid: [16, 32]
    lr_grid: [0.0005, 0.001]
    max_epochs: 40
    patience: 8
    layers: 1
tvp_var:
  p_grid: [1, 2, 3]
  halflife_grid: [21, 63, 126, 252]
