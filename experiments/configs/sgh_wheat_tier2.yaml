series_id: wheat
horizons: [1, 7, 30]
seed: 42
val_frac: 0.2
walk_forward:
  min_train: 504
  step: 21
  embargo: 0
costs_bps: [10, 20]
models:
  - sarima_lstm
  - fedformer
  - gwrfr
sarima_lstm:
  min_hist: 60
  ridge_alpha: 1.0
  order_grid:
    - [1, 0, 1]
    - [2, 0, 1]
    - [1, 0, 2]
  seasonal_grid:
    - [0, 0, 0, 0]
    - [1, 0, 1, 5]
    - [1, 0, 1, 21]
  lstm:
    window_grid: [21, 42]
    hidden_grid: [16, 32]
    lr_grid: [0.0005, 0.001]
    max_epochs: 40
    patience: 8
    layers: 1
fedformer:
  window: 42
  d_model: 32
  nhead: 2
  num_layers: 1
  dropout: 0.1
  n_freq: 4
  lr: 0.001
  max_epochs: 50
  patience: 8
gwrfr:
  bandwidth_grid: [21, 63, 126]
  n_estimators_grid: [100, 200]
  max_depth_grid: [4, 8, null]
