# Build obrazu Cloud Run Joba (inferencja).
#   gcloud builds submit --config gcp/cloudbuild.inference.yaml \
#     --substitutions=_IMAGE_URI=europe-west4-docker.pkg.dev/PROJECT/btc-tai/tsfm-inference:latest .
substitutions:
  _IMAGE_URI: "europe-west4-docker.pkg.dev/your-gcp-project/btc-tai/tsfm-inference:latest"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "--file=gcp/inference_job/Dockerfile"
      - "--tag=${_IMAGE_URI}"
      - "."

images:
  - "${_IMAGE_URI}"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
